services:
  wedding-music:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPOSITORY:-regie-mariage}:latest
    container_name: wedding-music
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - web
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  web:
    external: true
  database:
    external: true
